<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16140f">
  <title>Pena de vida</title>
  <link rel="stylesheet" href="css/styles.css?v=af8a833f">
</head>
<body>
  <main id="app">

    <section id="pantalla-inicio" class="pantalla activa">
      <div class="centro">
        <h1 class="titulo">Pena de vida</h1>
        <p class="subtitulo">Año 0 – Año 100</p>
        <button class="btn primario" id="btn-continuar" hidden>Continuar vida</button>
        <button class="btn" id="btn-nueva">Nueva vida</button>
        <button class="btn secundario" data-ajustes>Ajustes</button>
        <p class="stats" id="stats-inicio"></p>
      </div>
      <a class="enlace-discreto" href="revisor.html">Revisor de cartas</a>
    </section>

    <section id="pantalla-sexo" class="pantalla">
      <div class="centro">
        <h2>Elige sexo</h2>
        <div class="fila-botones">
          <button class="btn" data-sexo="M">Hombre</button>
          <button class="btn" data-sexo="F">Mujer</button>
        </div>
        <button class="btn secundario" data-sexo="azar">Aleatorio</button>
      </div>
    </section>

    <section id="pantalla-rasgo" class="pantalla">
      <div class="centro">
        <h2>Elige un rasgo</h2>
        <p class="ayuda" id="ayuda-rasgo"></p>
        <div class="lista-elecciones" id="lista-rasgos"></div>
      </div>
    </section>

    <section id="pantalla-comodin" class="pantalla">
      <div class="centro">
        <h2>Elige un comodín</h2>
        <p class="ayuda">Un solo uso en toda la partida.</p>
        <div class="lista-elecciones" id="lista-comodines"></div>
      </div>
    </section>

    <section id="pantalla-juego" class="pantalla">
      <header class="barras" id="barras"></header>
      <div class="escena">
      <div class="edad">
        <span id="edad-anio">Año 0</span>
        <span class="edad-etapa" id="edad-etapa"></span>
      </div>
      <p class="carta-texto" id="carta-texto"></p>
      <div class="mesa">
        <div class="carta" id="carta">
          <div class="carta-imagen" id="carta-imagen"></div>
          <div class="carta-eleccion" id="carta-eleccion"></div>
          <div class="carta-sello" id="carta-sello" hidden>Efectos invertidos</div>
        </div>
      </div>
      <p class="carta-nombre" id="carta-nombre"></p>
      <p class="pista" id="pista" hidden>← Desliza la carta para decidir →</p>
      </div>
      <footer class="pie-juego">
        <span></span>
        <button class="icono-btn comodin" id="btn-comodin"></button>
        <button class="icono-btn ajustes" data-ajustes aria-label="Ajustes" title="Ajustes"></button>
        <span class="debug" id="debug" hidden></span>
      </footer>
      <div class="aviso-flotante" id="aviso" hidden></div>
    </section>

    <section id="pantalla-necrologica" class="pantalla">
      <article class="necrologica" id="necrologica"></article>
      <div class="desbloqueos" id="desbloqueos"></div>
      <button class="btn primario" id="btn-otra">Volver a empezar</button>
    </section>

    <dialog id="ajustes" class="dialogo" aria-labelledby="titulo-ajustes">
      <form method="dialog">
        <h3 id="titulo-ajustes">Ajustes</h3>
        <label for="vol-musica">Música <output id="nivel-musica" for="vol-musica"></output></label>
        <input id="vol-musica" type="range" min="0" max="100">
        <label for="vol-efectos">Efectos <output id="nivel-efectos" for="vol-efectos"></output></label>
        <input id="vol-efectos" type="range" min="0" max="100">
        <button class="btn">Cerrar</button>
      </form>
    </dialog>

    <dialog id="dialogo-comodin" class="dialogo">
      <div class="dlg-icono" id="dlg-icono"></div>
      <h3 id="dlg-nombre"></h3>
      <p id="dlg-desc"></p>
      <div class="fila-botones">
        <button class="btn secundario" id="dlg-cancelar">Cancelar</button>
        <button class="btn primario" id="dlg-usar">Usar</button>
      </div>
    </dialog>

    <div class="error-carga" id="error-carga" hidden></div>
  </main>
  <script type="importmap">
  {
    "imports": {
      "./js/audio.js": "./js/audio.js?v=af8a833f",
      "./js/data.js": "./js/data.js?v=af8a833f",
      "./js/engine.js": "./js/engine.js?v=af8a833f",
      "./js/iconos.js": "./js/iconos.js?v=af8a833f",
      "./js/images.js": "./js/images.js?v=af8a833f",
      "./js/main.js": "./js/main.js?v=af8a833f",
      "./js/revisor.js": "./js/revisor.js?v=af8a833f",
      "./js/simulate.js": "./js/simulate.js?v=af8a833f",
      "./js/storage.js": "./js/storage.js?v=af8a833f",
      "./js/swipe.js": "./js/swipe.js?v=af8a833f",
      "./js/text.js": "./js/text.js?v=af8a833f",
      "./js/validate.js": "./js/validate.js?v=af8a833f"
    }
  }
  </script>
  <script type="module" src="js/main.js?v=af8a833f"></script>
</body>
</html>
