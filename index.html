<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16140f">
  <title>Pena de vida</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="app">

    <section id="pantalla-inicio" class="pantalla activa">
      <div class="centro">
        <h1 class="titulo">Pena de vida</h1>
        <p class="subtitulo">Año 0 – Año 100</p>
        <button class="btn primario" id="btn-nueva">Nueva partida</button>
        <p class="stats" id="stats-inicio"></p>
      </div>
      <a class="enlace-discreto" href="revisor.html">Revisor de cartas</a>
    </section>

    <section id="pantalla-sexo" class="pantalla">
      <div class="centro">
        <h2>Elige sexo</h2>
        <div class="fila-botones">
          <button class="btn" data-sexo="M">Hombre</button>
          <button class="btn" data-sexo="F">Mujer</button>
        </div>
        <button class="btn secundario" data-sexo="azar">Aleatorio</button>
      </div>
    </section>

    <section id="pantalla-rasgo" class="pantalla">
      <div class="centro">
        <h2>Elige un rasgo</h2>
        <p class="ayuda" id="ayuda-rasgo"></p>
        <div class="lista-elecciones" id="lista-rasgos"></div>
      </div>
    </section>

    <section id="pantalla-comodin" class="pantalla">
      <div class="centro">
        <h2>Elige un comodín</h2>
        <p class="ayuda">Un solo uso en toda la partida.</p>
        <div class="lista-elecciones" id="lista-comodines"></div>
      </div>
    </section>

    <section id="pantalla-juego" class="pantalla">
      <header class="barras" id="barras"></header>
      <div class="edad">
        <span id="edad-anio">Año 0</span>
        <span class="edad-etapa" id="edad-etapa"></span>
      </div>
      <p class="carta-texto" id="carta-texto"></p>
      <div class="mesa">
        <div class="carta" id="carta">
          <div class="carta-imagen" id="carta-imagen"></div>
          <div class="carta-eleccion" id="carta-eleccion"></div>
          <div class="carta-sello" id="carta-sello" hidden>Efectos invertidos</div>
        </div>
      </div>
      <p class="carta-nombre" id="carta-nombre"></p>
      <p class="pista" id="pista" hidden>← Desliza la carta para decidir →</p>
      <footer class="pie-juego">
        <button class="btn comodin" id="btn-comodin"></button>
        <span class="debug" id="debug" hidden></span>
      </footer>
      <div class="aviso-flotante" id="aviso" hidden></div>
    </section>

    <section id="pantalla-necrologica" class="pantalla">
      <article class="necrologica" id="necrologica"></article>
      <div class="desbloqueos" id="desbloqueos"></div>
      <button class="btn primario" id="btn-otra">Volver a empezar</button>
    </section>

    <dialog id="dialogo-comodin" class="dialogo">
      <h3 id="dlg-nombre"></h3>
      <p id="dlg-desc"></p>
      <div class="fila-botones">
        <button class="btn secundario" id="dlg-cancelar">Cancelar</button>
        <button class="btn primario" id="dlg-usar">Usar</button>
      </div>
    </dialog>

    <div class="error-carga" id="error-carga" hidden></div>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
