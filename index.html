<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16140f">
  <title>Pena de vida</title>
  <meta name="description" content="Juego de cartas de humor negro: sobrevive del año 0 al 100 decidiendo con un gesto.">
  <link rel="icon" href="assets/icons/favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png?v=2">
  <link rel="manifest" href="manifest.json?v=2">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Pena de vida">
  <meta property="og:description" content="Sobrevive del año 0 al 100. Si llegas, la condena se prorroga.">
  <meta property="og:url" content="https://javiiitalavera.github.io/Pena-de-vida/">
  <meta property="og:image" content="https://javiiitalavera.github.io/Pena-de-vida/assets/icons/og-image.png?v=2">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="es_ES">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="apple-mobile-web-app-title" content="Pena de vida">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/styles.css?v=50ec19d2">
</head>
<body>
  <main id="app">

    <section id="pantalla-inicio" class="pantalla activa portada">
      <header class="portada-cabecera">
        <h1 class="titulo">Pena de vida</h1>
        <p class="subtitulo" id="subtitulo-inicio"></p>
      </header>
      <figure class="portada-arte" id="portada-arte" aria-hidden="true"></figure>
      <div class="portada-botones">
        <button class="btn primario" id="btn-continuar" hidden>Continuar vida</button>
        <button class="btn" id="btn-nueva">Nueva vida</button>
        <button class="portada-ajustes" data-ajustes aria-label="Ajustes" title="Ajustes"></button>
      </div>
      <footer class="portada-pie">
        <button class="stats enlace-archivo" id="stats-inicio" hidden></button>
      </footer>
    </section>

    <section id="pantalla-juego" class="pantalla">
      <header class="barras" id="barras"></header>
      <div class="escena">
      <div class="cabecera-carta">
        <p class="linea-anio"><span id="edad-anio">Año 0</span><span class="separador" aria-hidden="true">·</span><span id="carta-nombre"></span></p>
      </div>
      <p class="carta-texto" id="carta-texto"></p>
      <div class="mesa">
        <div class="carta" id="carta">
          <div class="carta-imagen" id="carta-imagen"></div>
          <div class="carta-eleccion" id="carta-eleccion"></div>
          <div class="carta-sello" id="carta-sello" hidden>Efectos invertidos</div>
          <div class="carta-dorso" id="carta-dorso" role="status" hidden></div>
        </div>
      </div>
      <p class="edad-etapa" id="edad-etapa"></p>
      <p class="pista" id="pista" hidden>← Desliza la carta para decidir →</p>
      </div>
      <footer class="pie-juego">
        <span></span>
        <button class="icono-btn comodin" id="btn-comodin"></button>
        <button class="icono-btn ajustes" data-ajustes aria-label="Ajustes" title="Ajustes"></button>
        <span class="debug" id="debug" hidden></span>
      </footer>
      <div class="aviso-flotante" id="aviso" hidden></div>
    </section>

    <section id="pantalla-necrologica" class="pantalla">
      <article class="necrologica" id="necrologica"></article>
      <div class="desbloqueos" id="desbloqueos"></div>
      <div class="necro-acciones">
        <button class="btn primario" id="btn-otra">Volver a empezar</button>
        <button class="btn secundario" id="btn-compartir">Compartir</button>
      </div>
    </section>

    <section id="pantalla-archivo" class="pantalla eleccion-sexo">
      <header class="portada-cabecera">
        <h2 class="titulo">Archivo</h2>
      </header>
      <div class="archivo" id="archivo"></div>
      <button class="volver" id="btn-volver-archivo">← Volver</button>
    </section>

    <dialog id="ajustes" class="impreso" aria-labelledby="titulo-ajustes">
      <form method="dialog">
        <h3 id="titulo-ajustes">Ajustes</h3>
        <fieldset class="selector-dificultad">
          <legend>Dificultad</legend>
          <div class="niveles" id="niveles"></div>
          <p class="nivel-nota" id="nivel-nota" hidden>Desde la próxima vida.</p>
        </fieldset>
        <fieldset class="sonido">
          <legend>Sonido</legend>
          <label for="vol-musica">Música <output id="nivel-musica" for="vol-musica"></output></label>
          <input id="vol-musica" type="range" min="0" max="100">
          <label for="vol-efectos">Efectos <output id="nivel-efectos" for="vol-efectos"></output></label>
          <input id="vol-efectos" type="range" min="0" max="100">
        </fieldset>
        <button class="impreso-cerrar">Cerrar</button>
      </form>
    </dialog>

    <dialog id="dialogo-comodin" class="impreso contexto-comodin" aria-labelledby="dlg-nombre" aria-describedby="dlg-desc">
      <div class="dlg-icono" id="dlg-icono"></div>
      <h3 id="dlg-nombre"></h3>
      <p id="dlg-desc"></p>
      <div class="contexto-acciones">
        <button class="impreso-cerrar" id="dlg-cancelar">Cancelar</button>
        <button class="impreso-cerrar confirmar" id="dlg-usar">Usar</button>
      </div>
    </dialog>

    <div class="error-carga" id="error-carga" hidden></div>
  </main>
  <script type="importmap">
  {
    "imports": {
      "./js/audio.js": "./js/audio.js?v=50ec19d2",
      "./js/data.js": "./js/data.js?v=50ec19d2",
      "./js/engine.js": "./js/engine.js?v=50ec19d2",
      "./js/iconos.js": "./js/iconos.js?v=50ec19d2",
      "./js/images.js": "./js/images.js?v=50ec19d2",
      "./js/main.js": "./js/main.js?v=50ec19d2",
      "./js/revisor.js": "./js/revisor.js?v=50ec19d2",
      "./js/simulate.js": "./js/simulate.js?v=50ec19d2",
      "./js/storage.js": "./js/storage.js?v=50ec19d2",
      "./js/swipe.js": "./js/swipe.js?v=50ec19d2",
      "./js/text.js": "./js/text.js?v=50ec19d2",
      "./js/validate.js": "./js/validate.js?v=50ec19d2"
    }
  }
  </script>
  <script type="module" src="js/main.js?v=50ec19d2"></script>
</body>
</html>
